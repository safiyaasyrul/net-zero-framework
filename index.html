<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Net-Zero Decision-Support Framework for Malaysian Maritime Fleet. Explore CII compliance, simulate fuel-switching scenarios, and get mitigation recommendations." />
  <title>Net-Zero Decision-Support Framework | Malaysian Maritime Fleet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/styles/index.css" />
</head>
<body>
  <div id="app">
    <header class="app-header">
      <div class="header-content">
        <div class="logo-section">
          <div class="logo-icon">
            <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="20" cy="20" r="18" stroke="url(#grad1)" stroke-width="2.5"/>
              <path d="M12 25 L20 13 L28 25" stroke="url(#grad1)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
              <path d="M16 21 L20 15 L24 21" stroke="url(#grad2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.6"/>
              <line x1="20" y1="25" x2="20" y2="30" stroke="url(#grad1)" stroke-width="2" stroke-linecap="round"/>
              <defs>
                <linearGradient id="grad1" x1="0" y1="0" x2="40" y2="40">
                  <stop offset="0%" stop-color="#00d4aa"/>
                  <stop offset="100%" stop-color="#0099ff"/>
                </linearGradient>
                <linearGradient id="grad2" x1="0" y1="0" x2="40" y2="40">
                  <stop offset="0%" stop-color="#00d4aa"/>
                  <stop offset="100%" stop-color="#00ff88"/>
                </linearGradient>
              </defs>
            </svg>
          </div>
          <div class="logo-text">
            <h1>Net-Zero Framework</h1>
            <p>Malaysian Maritime Fleet Decision Support</p>
          </div>
        </div>
        
        <div class="fleet-toggle-container">
          <span class="fleet-label">🇲🇾 Malaysian</span>
          <label class="toggle-switch">
            <input type="checkbox" id="fleetToggle">
            <span class="toggle-slider"></span>
          </label>
          <span class="fleet-label">🌍 Global</span>
        </div>

        <nav class="main-nav" id="mainNav">
          <button class="nav-btn active" data-view="dashboard" id="nav-dashboard">
            <span class="nav-icon">📊</span>
            <span class="nav-label">Fleet Dashboard</span>
          </button>
          <button class="nav-btn" data-view="simulator" id="nav-simulator">
            <span class="nav-icon">⚗️</span>
            <span class="nav-label">Fuel Simulator</span>
          </button>
          <button class="nav-btn" data-view="recommendations" id="nav-recommendations">
            <span class="nav-icon">📋</span>
            <span class="nav-label">Mitigation</span>
          </button>
        </nav>
      </div>
    </header>

    <main class="app-main" id="appMain">
      <div class="loading-screen" id="loadingScreen">
        <div class="loading-spinner"></div>
        <p>Loading fleet data...</p>
      </div>
    </main>

    <footer class="app-footer">
      <p>Data Source: Jabatan Laut Malaysia (JLM) | Research: Dr. Wan Nurdiyana Wan Mansor, UMT</p>
    </footer>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
